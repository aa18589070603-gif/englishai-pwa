<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101828"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>EnglishAI 跟读</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf7;background:#0b1220}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:780px;margin:auto}header{padding:20px 0 10px}h1{font-size:25px;margin:0}p,.hint{color:#aab8cc;line-height:1.6}.card{background:#18243a;border:1px solid #293b55;border-radius:16px;padding:15px;margin:14px 0}label{display:block;margin:8px 0;color:#cbd5e1;font-size:14px}input[type=file],textarea{width:100%;background:#0d1829;color:#f1f5f9;border:1px solid #34445d;border-radius:9px;padding:10px}video{width:100%;background:#000;border-radius:10px;max-height:42vh}button{background:#37c9ae;color:#082022;border:0;border-radius:10px;padding:11px 13px;font-weight:700;margin:5px 4px 5px 0;cursor:pointer}button.secondary{background:#2a3d59;color:#fff}button:disabled{opacity:.45}#lines{max-height:38vh;overflow:auto}.line{padding:12px;border-bottom:1px solid #34445d;cursor:pointer}.line.active{background:#25465a;border-left:4px solid #37c9ae}.zh{color:#aab8cc;margin-top:4px;font-size:14px}.small{font-size:12px;color:#9fb0c8}.status{color:#5eead4}textarea{min-height:100px}a{color:#67e8f9} .hidden{display:none}</style></head><body><header><h1>🎧 EnglishAI · 视频跟读</h1><p>第一版：本地视频、双语字幕、逐句循环、录音对比。视频和录音默认留在你的设备里。</p></header>
<section class="card"><label>① 选择手机中的 MP4 / MOV 视频</label><input id="videoFile" type="file" accept="video/*"><label>② 选择 SRT 或 VTT 字幕（可选）</label><input id="subtitleFile" type="file" accept=".srt,.vtt,text/plain"><p class="small">双语字幕格式：英文一行、中文一行。也可以直接使用下方示例字幕练习。</p><button id="sample" class="secondary">载入示例字幕</button><button id="clear" class="secondary">清空字幕</button></section>
<section class="card"><video id="player" playsinline controls preload="metadata"></video><div><button id="prev" class="secondary">上一句</button><button id="play">播放本句</button><button id="next" class="secondary">下一句</button></div><label><input type="checkbox" id="loop" checked> 自动循环当前句</label><div id="current" class="hint">选择视频与字幕后，点击句子开始跟读。</div></section>
<section class="card"><h3>🎙 跟读录音</h3><p class="small">iPhone 需要 HTTPS 页面并允许麦克风。录音后可播放自己的声音，与原视频对比。</p><button id="record">开始录音</button><button id="stop" class="secondary" disabled>停止录音</button><div id="recStatus" class="status" role="status">尚未录音</div><audio id="recorded" controls class="hidden" style="width:100%;margin-top:10px"></audio><p class="small">此版本不提供 AI 评分；语音识别与发音诊断将在下一阶段接入。</p></section>
<section class="card"><h3>📃 句子列表</h3><div id="lines" class="hint">尚未载入字幕</div></section>
<section class="card"><details><summary>没有字幕？手动粘贴 SRT 文本</summary><label>粘贴字幕内容</label><textarea id="paste" placeholder="1&#10;00:00:01,000 --> 00:00:03,000&#10;Hello, how are you?&#10;你好，你好吗？"></textarea><button id="parsePaste">读取粘贴字幕</button></details></section>
<script>
const $=id=>document.getElementById(id);let cues=[],idx=-1,videoURL=null,recURL=null,stream=null,recorder=null,chunks=[];
function seconds(t){let s=t.trim().replace(',','.').split(':').map(Number);if(s.some(Number.isNaN))return NaN;return s.reduce((a,b)=>a*60+b,0)}
function parse(text){text=text.replace(/^\uFEFF/,'').replace(/\r/g,'').replace(/^WEBVTT[^\n]*\n/,'');let blocks=text.trim().split(/\n\s*\n/);let out=[];for(const block of blocks){let rows=block.split('\n').map(s=>s.trim()).filter(Boolean),i=rows.findIndex(x=>x.includes('-->'));if(i<0)continue;let times=rows[i].split('-->'),start=seconds(times[0]),end=seconds(times[1].trim().split(/\s+/)[0]);if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start)continue;let content=rows.slice(i+1).map(x=>x.replace(/<[^>]*>/g,''));out.push({start,end,en:content[0]||'',zh:content.slice(1).join(' ')})}return out.sort((a,b)=>a.start-b.start)}
function render(){let root=$('lines');root.replaceChildren();if(!cues.length){root.textContent='没有有效字幕，请导入 SRT/VTT 或载入示例。';return}cues.forEach((c,i)=>{let el=document.createElement('div');el.className='line'+(i===idx?' active':'');let en=document.createElement('div');en.textContent=(i+1)+'. '+c.en;let zh=document.createElement('div');zh.className='zh';zh.textContent=c.zh;el.append(en,zh);el.onclick=()=>select(i,true);root.append(el)});}
function select(i,play){if(i<0||i>=cues.length)return;idx=i;let c=cues[i];$('current').textContent=c.en+(c.zh?'\n'+c.zh:'');render();if($('player').src){$('player').currentTime=c.start;if(play)$('player').play().catch(()=>{});}}
$('videoFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(videoURL)URL.revokeObjectURL(videoURL);videoURL=URL.createObjectURL(f);$('player').src=videoURL;};
$('subtitleFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;cues=parse(await f.text());idx=-1;render();if(cues.length)select(0,false)};
$('sample').onclick=()=>{cues=parse('1\n00:00:01,000 --> 00:00:04,000\nHello, how are you?\n你好，你好吗？\n\n2\n00:00:04,000 --> 00:00:07,000\nI am learning English every day.\n我每天都在学习英语。\n\n3\n00:00:07,000 --> 00:00:10,000\nPractice makes progress.\n练习带来进步。');idx=-1;select(0,false)};
$('clear').onclick=()=>{cues=[];idx=-1;render();$('current').textContent='字幕已清空'};
$('parsePaste').onclick=()=>{cues=parse($('paste').value);idx=-1;render();if(cues.length)select(0,false)};
$('prev').onclick=()=>select(Math.max(0,idx-1),true);$('next').onclick=()=>select(Math.min(cues.length-1,idx+1),true);$('play').onclick=()=>{if(idx<0&&cues.length)idx=0;if(idx>=0)select(idx,true);else $('player').play().catch(()=>{})};
$('player').addEventListener('timeupdate',()=>{if(idx<0||!cues[idx])return;let c=cues[idx],v=$('player');if(v.currentTime>=c.end){if($('loop').checked){v.currentTime=c.start;if(v.paused)v.play().catch(()=>{})}else{v.pause();}}});
$('record').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('当前页面不支持录音，请使用 HTTPS 和 Safari');stream=await navigator.mediaDevices.getUserMedia({audio:true});let types=['audio/mp4','audio/webm;codecs=opus','audio/webm'];let mime=types.find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(recURL)URL.revokeObjectURL(recURL);let blob=new Blob(chunks,{type:recorder.mimeType||'audio/mp4'});recURL=URL.createObjectURL(blob);$('recorded').src=recURL;$('recorded').classList.remove('hidden');$('recStatus').textContent='录音完成，可以播放对比';stream?.getTracks().forEach(t=>t.stop());stream=null;$('record').disabled=false;$('stop').disabled=true};recorder.start();$('record').disabled=true;$('stop').disabled=false;$('recStatus').textContent='正在录音…';}catch(err){$('recStatus').textContent='无法录音：'+err.message}};
$('stop').onclick=()=>{if(recorder?.state==='recording')recorder.stop()};
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
